<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tarjeta de Producto</title>
  <!-- Enlace a la hoja de estilos externa -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="container">
    <article class="card">
      
      <!-- Contenedor superior con imagen y etiqueta -->
      <div class="image-wrapper">
        <span class="badge">Nuevo</span>
        <img 
          src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" 
          alt="Zapatillas Nike Air Max Red" 
        />
      </div>

      <!-- Contenido de la tarjeta -->
      <div class="card-content">
        <h2 class="card-title">Nike Air Max Red</h2>
        <p class="card-description">
          Amortiguación reactiva y diseño ligero para tu día a día.
        </p>
        
        <!-- Precios -->
        <div class="price-container">
          <span class="price-current">$129.99</span>
          <span class="price-old">$159.99</span>
        </div>

        <!-- Botón de acción -->
        <button type="button" class="btn-primary">Añadir al carrito</button>
      </div>

    </article>

    <article class="card">
      
        <!-- Contenedor superior con imagen y etiqueta -->
        <div class="image-wrapper">
          <span class="badge">Nuevo</span>
          <img 
            src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500" 
            alt="Zapatillas Nike Air Max Red" 
          />
        </div>
  
        <!-- Contenido de la tarjeta -->
        <div class="card-content">
          <h2 class="card-title">Nike Air Max Red</h2>
          <p class="card-description">
            Amortiguación reactiva y diseño ligero para tu día a día.
          </p>
          
          <!-- Precios -->
          <div class="price-container">
            <span class="price-current">$129.99</span>
            <span class="price-old">$159.99</span>
          </div>
  
          <!-- Botón de acción -->
          <button type="button" class="btn-primary">Añadir al carrito</button>
        </div>
  
      </article>
  </main>

</body>
</html>
